<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Calculator View (Default Visible) -->
    <div id="calculator-view">
        <div class="calculator-container">
            <div class="calculator-header">
                <button id="login-trigger" class="login-icon" title="Settings">π</button>
            </div>
            <div class="calculator-display">
                <div id="display">0</div>
            </div>
            <div class="calculator-buttons">
                <button class="btn function" data-action="clear">AC</button>
                <button class="btn function" data-action="toggle-sign">+/-</button>
                <button class="btn function" data-action="percent">%</button>
                <button class="btn operator" data-action="divide">÷</button>

                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn operator" data-action="multiply">×</button>

                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn operator" data-action="subtract">−</button>

                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn operator" data-action="add">+</button>

                <button class="btn number zero" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn operator" data-action="equals" id="equals-btn">=</button>
            </div>
        </div>
    </div>

    <!-- Login Modal (Hidden by Default) -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Login</h2>
            <div id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button id="login-btn">Login</button>
                <button id="signup-btn" class="secondary">Sign Up</button>
            </div>
            <div id="signup-form" class="hidden">
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <input type="text" id="signup-name" placeholder="Display Name" required>
                <input type="text" id="signup-passcode" placeholder="Passcode (e.g., 1234)" required>
                <button id="create-account-btn">Create Account</button>
                <button id="back-to-login-btn" class="secondary">Back to Login</button>
            </div>
            <div id="auth-error" class="error-message"></div>
        </div>
    </div>

    <!-- Chat App (Hidden by Default) -->
    <div id="chat-app" class="hidden">
        <div class="chat-container">
            <!-- User List Sidebar -->
            <div class="user-list-container" id="user-list-container">
                <div class="chat-header">
                    <h2>Messages</h2>
                    <button id="logout-btn" class="logout-icon" title="Logout">⎋</button>
                </div>
                <div class="current-user-profile">
                    <div class="current-user-avatar-block">
                        <div class="user-avatar current-user-avatar" id="current-user-avatar">?</div>
                        <div class="online-indicator hidden" id="current-user-indicator"></div>
                    </div>
                    <div class="current-user-info">
                        <div class="current-user-meta">
                            <div class="current-user-name" id="current-user-name">You</div>
                            <span class="current-user-presence" id="current-user-status">offline</span>
                        </div>
                        <div class="current-user-email" id="current-user-email"></div>
                        <div class="current-user-tagline" id="current-user-tagline">Add a status</div>
                    </div>
                    <button id="edit-profile-btn" class="profile-edit-btn">Edit</button>
                </div>
                <div class="story-strip" id="story-strip">
                    <button class="story-card add" id="add-story-btn">
                        <div class="story-avatar">
                            <span>+</span>
                        </div>
                        <small>Add story</small>
                    </button>
                    <div class="story-list" id="story-list"></div>
                </div>
                <input type="file" id="profile-avatar-input" accept="image/*" class="hidden">
                <input type="file" id="story-file-input" accept="image/*" class="hidden">
                <div class="user-list" id="user-list">
                    <!-- Users will be dynamically loaded here -->
                </div>
            </div>

            <!-- Chat Window -->
            <div class="chat-window-container" id="chat-window-container">
                <div class="chat-window-header">
                    <button id="back-to-users" class="back-btn">←</button>
                    <div class="chat-user-info">
                        <div id="chat-user-avatar" class="chat-avatar">?</div>
                        <div>
                            <div id="chat-user-name">Select a user</div>
                            <div id="chat-user-status" class="user-status">offline</div>
                        </div>
                    </div>
                </div>

                <div class="messages-container" id="messages-container">
                    <!-- Messages will be dynamically loaded here -->
                </div>

                <div class="typing-indicator hidden" id="typing-indicator">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <!-- Reply Preview Bar (Hidden by Default) -->
                <div id="reply-preview" class="reply-preview hidden">
                    <div class="reply-preview-content">
                        <div class="reply-preview-header">
                            <span class="reply-to-name"></span>
                            <button id="cancel-reply" class="cancel-reply-btn">×</button>
                        </div>
                        <div class="reply-preview-text"></div>
                    </div>
                </div>

                <div class="message-input-container">
                    <button id="image-upload-btn" class="icon-btn" title="Upload Image">📎</button>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                    <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
                    <button id="send-btn" class="send-btn" title="Send">
                        <span class="send-btn-icon">➤</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reaction Popup (Hidden by Default) -->
    <div id="reaction-popup" class="reaction-popup hidden">
        <button class="reaction-btn" data-emoji="👍">👍</button>
        <button class="reaction-btn" data-emoji="❤️">❤️</button>
        <button class="reaction-btn" data-emoji="😂">😂</button>
        <button class="reaction-btn" data-emoji="😮">😮</button>
        <button class="reaction-btn" data-emoji="😢">😢</button>
        <button class="reaction-btn" data-emoji="🔥">🔥</button>
    </div>

    <!-- Message Options Menu (Hidden by Default) -->
    <div id="message-options" class="message-options hidden">
        <button class="option-btn" data-action="reply">Reply</button>
        <button class="option-btn" data-action="edit">Edit</button>
        <button class="option-btn" data-action="delete">Delete</button>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal hidden profile-modal">
        <div class="modal-content profile-modal-content">
            <span class="close-modal" id="close-profile-modal">&times;</span>
            <h2>Edit Profile</h2>
            <div class="profile-modal-body">
                <div class="profile-avatar-preview">
                    <div class="avatar-ring">
                        <div class="user-avatar large" id="profile-avatar-circle">?</div>
                    </div>
                    <button id="change-avatar-btn" class="secondary">Change photo</button>
                </div>
                <label for="profile-name-input">Display name</label>
                <input type="text" id="profile-name-input" placeholder="Display name">
                <label for="profile-passcode-input">Passcode</label>
                <input type="text" id="profile-passcode-input" placeholder="Unlock passcode">
                <label for="profile-status-input">Status message</label>
                <textarea id="profile-status-input" rows="2" placeholder="Let friends know what you're up to"></textarea>
                <div class="profile-modal-actions">
                    <button id="cancel-profile-btn" class="secondary">Cancel</button>
                    <button id="save-profile-btn">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Story Viewer -->
    <div id="story-viewer" class="story-viewer hidden">
        <div class="story-viewer-backdrop"></div>
        <div class="story-viewer-content">
            <button id="story-viewer-close" class="story-viewer-close">×</button>
            <div class="story-progress" id="story-progress"></div>
            <div class="story-viewer-header">
                <div class="story-viewer-user">
                    <div class="user-avatar" id="story-viewer-avatar">?</div>
                    <div>
                        <div id="story-viewer-name">Name</div>
                        <div id="story-viewer-time" class="story-viewer-time">Just now</div>
                    </div>
                </div>
                <div class="story-viewer-controls">
                    <button id="story-prev-btn" class="story-nav-btn">‹</button>
                    <button id="story-next-btn" class="story-nav-btn">›</button>
                </div>
            </div>
            <img id="story-viewer-media" src="" alt="Story" class="story-viewer-media">
            <div class="story-viewer-footer">
                <button id="story-like-btn" class="story-like-btn">♡</button>
                <span id="story-like-count" class="story-like-count">0 likes</span>
            </div>
        </div>
    </div>

    <!-- Image Viewer Modal -->
    <div id="image-viewer" class="image-viewer hidden">
        <div class="image-viewer-backdrop"></div>
        <div class="image-viewer-content">
            <button id="image-viewer-close" class="image-viewer-close">×</button>
            <img id="image-viewer-img" src="" alt="Preview" class="image-viewer-img">
            <a id="image-viewer-download" class="image-viewer-download" download>Download</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="script.js"></script>
</body>

</html>
