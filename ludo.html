<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ludo Duel - 2 Player Game</title>
    <link rel="stylesheet" href="ludo.css">
</head>
<body>
    <!-- Global Loading Screen -->
    <div id="global-loading" class="global-loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>

    <!-- Ludo Game Container -->
    <div id="ludo-container" class="ludo-container hidden">
        <!-- Header -->
        <div class="ludo-header">
            <button id="back-to-chat-btn" class="back-btn" title="Back to Chat">← Back</button>
            <h1>🎲 Ludo Duel</h1>
            <div class="header-spacer"></div>
        </div>

        <!-- Status Board -->
        <div class="ludo-status">
            <div class="player-status red-player">
                <div class="player-avatar" id="red-avatar">R</div>
                <div class="player-info">
                    <div class="player-name" id="red-name">Red Player</div>
                    <div class="player-turn" id="red-turn">Waiting...</div>
                </div>
            </div>

            <div class="vs-text">VS</div>

            <div class="player-status yellow-player">
                <div class="player-avatar" id="yellow-avatar">Y</div>
                <div class="player-info">
                    <div class="player-name" id="yellow-name">Yellow Player</div>
                    <div class="player-turn" id="yellow-turn">Waiting...</div>
                </div>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="ludo-game-area">
            <!-- Ludo Board -->
            <div class="ludo-board-container">
                <div class="ludo-board">
                    <!-- Red Base (Bottom-Left) -->
                    <div class="base red-base">
                        <div class="base-label">Red</div>
                        <div class="base-tokens">
                            <div class="token red-token" data-token="r1"></div>
                            <div class="token red-token" data-token="r2"></div>
                            <div class="token red-token" data-token="r3"></div>
                            <div class="token red-token" data-token="r4"></div>
                        </div>
                    </div>

                    <!-- Yellow Base (Top-Right) -->
                    <div class="base yellow-base">
                        <div class="base-label">Yellow</div>
                        <div class="base-tokens">
                            <div class="token yellow-token" data-token="y1"></div>
                            <div class="token yellow-token" data-token="y2"></div>
                            <div class="token yellow-token" data-token="y3"></div>
                            <div class="token yellow-token" data-token="y4"></div>
                        </div>
                    </div>

                    <!-- Green Base (Inactive) -->
                    <div class="base green-base inactive">
                        <div class="base-label">Green</div>
                    </div>

                    <!-- Blue Base (Inactive) -->
                    <div class="base blue-base inactive">
                        <div class="base-label">Blue</div>
                    </div>

                    <!-- Main Path Grid -->
                    <div class="path-grid" id="path-grid"></div>

                    <!-- Home Straights -->
                    <div class="home-straight red-home" id="red-home"></div>
                    <div class="home-straight yellow-home" id="yellow-home"></div>
                </div>
            </div>

            <!-- Game Controls -->
            <div class="ludo-controls">
                <div class="dice-container">
                    <div class="dice" id="dice">
                        <div class="dice-face">1</div>
                    </div>
                    <button id="roll-dice-btn" class="roll-btn">🎲 Roll Dice</button>
                </div>

                <div class="game-info">
                    <div class="turn-display" id="turn-display">Red's Turn</div>
                    <div class="dice-result" id="dice-result">Roll the dice!</div>
                </div>
            </div>
        </div>

        <!-- In-Game Chat Section -->
        <div class="ludo-chat">
            <div class="chat-header">💬 Chat</div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-container">
                <input 
                    type="text" 
                    id="chat-input" 
                    class="chat-input" 
                    placeholder="Type a message..."
                    maxlength="100"
                >
                <button id="send-chat-btn" class="send-btn">Send</button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content">
                <div class="game-over-message" id="game-over-message">
                    🏆 Red Wins!
                </div>
                <button id="play-again-btn" class="play-again-btn">Play Again</button>
                <button id="back-to-chat-from-modal-btn" class="secondary">Back to Chat</button>
            </div>
        </div>
    </div>

    <!-- Login Modal (if not authenticated) -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Sign In Required</h2>
            <p>Please sign in to play games.</p>
            <button id="go-to-login-btn" class="primary">Go to Login</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="ludo.js"></script>
</body>
</html>
