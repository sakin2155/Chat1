<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch Party</title>
    <link rel="stylesheet" href="watch.css">
</head>

<body>
    <div id="global-loading" class="global-loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">Connecting to watch party…</p>
        </div>
    </div>

    <main id="watch-container" class="watch-container hidden">
        <header class="watch-header">
            <button id="back-to-chat-btn" class="back-btn" title="Back to chat">← Chat</button>
            <div class="watch-header-info">
                <h1 id="watch-video-title">Watch Party</h1>
                <p id="watch-host-line">Hosted by —</p>
            </div>
            <div class="watch-header-actions">
                <button id="copy-invite-btn" class="secondary-btn">Copy Invite</button>
                <button id="end-watch-btn" class="danger-btn hidden">End Session</button>
            </div>
        </header>

        <section class="watch-layout">
            <div class="video-section">
                <div id="youtube-player" class="youtube-player"></div>
                <div id="sync-status" class="sync-status">Waiting for host…</div>
                <div class="watch-controls">
                    <button id="play-toggle-btn" class="primary-btn">Play / Pause</button>
                    <button id="sync-now-btn" class="ghost-btn">Sync to Host</button>
                </div>
            </div>
            <aside class="watch-sidebar">
                <div class="sidebar-card">
                    <div class="sidebar-card-header">
                        <h3>Participants</h3>
                        <span id="participant-count" class="pill">0</span>
                    </div>
                    <div id="participants-list" class="participants-list"></div>
                </div>
                <div class="sidebar-card">
                    <div class="sidebar-card-header">
                        <h3>Activity</h3>
                    </div>
                    <div id="activity-log" class="activity-log"></div>
                </div>
            </aside>
        </section>
    </main>

    <div id="session-ended" class="session-ended hidden">
        <div class="session-ended-card">
            <h2>Session Ended</h2>
            <p id="session-ended-message">This watch party is no longer active.</p>
            <button id="session-back-btn" class="primary-btn">Back to Chat</button>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Sign in required</h2>
            <p>You need to sign in through the main app to join the watch party.</p>
            <button id="go-to-login-btn" class="primary-btn">Go to Login</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="watch.js"></script>
</body>

</html>
